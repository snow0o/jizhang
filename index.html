<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>记账</title>

  <meta name="theme-color" content="#f3f4f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="记账" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  

<style>
  :root{
    --bg:#eef1f4;
    --bg2:#f8fafc;
    --panel:rgba(255,255,255,.88);
    --panel-strong:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:rgba(15,23,42,.10);
    --line-strong:rgba(15,23,42,.18);
    --accent:#d9dee5;
    --accent-2:#f3f4f6;
    --danger:#dc2626;
    --shadow:0 12px 30px rgba(15,23,42,.08);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      linear-gradient(180deg, #f7f8fa 0%, #eef1f4 100%);
    min-height:100vh;
  }

  .wrap{
    max-width:780px;
    margin:0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(42px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
  }

  h1{
    font-size:30px;
    margin:0 0 16px;
    font-weight:900;
    letter-spacing:.06em;
  }

  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:18px;
    letter-spacing:.04em;
  }

  .card{
    position:relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,.96), rgba(244,246,248,.94));
    border:1px solid var(--line);
    border-radius:22px;
    padding:16px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg, rgba(255,255,255,.72), transparent 30%, transparent 70%, rgba(217,222,229,.35));
    pointer-events:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:0 0 7px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  input,select,button{
    width:100%;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 13px;
    font-size:15px;
    color:var(--text);
    background:rgba(255,255,255,.92);
    transition:.18s ease;
  }

  input::placeholder{
    color:#9ca3af;
  }

  input:focus,select:focus{
    outline:none;
    border-color:var(--line-strong);
    background:#fff;
    box-shadow:0 0 0 1px rgba(15,23,42,.08), 0 6px 18px rgba(15,23,42,.06);
  }

  select option{
    background:#ffffff;
    color:var(--text);
  }

  .full{grid-column:1/-1}

  .btn{
    border:1px solid rgba(15,23,42,.10);
    background:linear-gradient(180deg, #fdfdfd, #e9edf2);
    color:var(--text);
    font-weight:800;
    letter-spacing:.06em;
    cursor:pointer;
  }

  .btn:hover{
    transform:translateY(-1px);
    background:linear-gradient(180deg, #ffffff, #e3e8ef);
  }

  .summary{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }

  .sum{
    background:
      linear-gradient(180deg, #ffffff, #f3f5f7);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
  }

  .sum .name{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .sum .money{
    font-size:18px;
    font-weight:900;
    margin-top:8px;
    letter-spacing:.02em;
  }

  .section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }

  .section-title h2{
    font-size:17px;
    margin:0;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .clear{
    width:auto;
    border:1px solid transparent;
    background:transparent;
    color:var(--danger);
    padding:7px 8px;
    font-size:13px;
    cursor:pointer;
  }

  .clear:hover{
    border-color:rgba(220,38,38,.15);
    background:rgba(220,38,38,.04);
  }

  .record{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:13px 0;
    border-top:1px solid rgba(15,23,42,.08);
  }

  .record:first-child{border-top:none}

  .left{min-width:0}

  .title{
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    letter-spacing:.01em;
  }

  .meta{
    font-size:12px;
    color:var(--muted);
    margin-top:5px;
  }

  .right{
    text-align:right;
    flex:none;
  }

  .amount{
    font-weight:900;
    letter-spacing:.02em;
  }

  .delete{
    width:auto;
    border:none;
    background:transparent;
    color:var(--danger);
    font-size:12px;
    padding:4px 0 0;
    cursor:pointer;
  }

  .delete:hover{
    text-decoration:underline;
  }

  .empty{
    color:var(--muted);
    text-align:center;
    padding:22px 0 10px;
  }

  .date-group{
    margin-top:14px;
  }

  .date-group:first-child{
    margin-top:4px;
  }

  .date-heading{
    position:sticky;
    top:0;
    z-index:1;
    background:rgba(247,248,250,.95);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(15,23,42,.08);
    font-size:12px;
    font-weight:900;
    color:#6b7280;
    padding:8px 0 7px;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  .filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:8px;
  }

  .result-box{
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    background:linear-gradient(180deg, #ffffff, #f3f5f7);
  }

  .result-big{
    font-size:22px;
    font-weight:900;
    margin-top:4px;
  }

  .small-note{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }

  .fx-status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(180deg,#ffffff,#f4f6f8);
  }

  .fx-status-text{
    min-width:0;
    font-size:12px;
    color:var(--muted);
  }

  .fx-refresh{
    width:auto;
    flex:none;
    padding:8px 11px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(180deg,#fff,#e8ecf1);
  }

  .fx-rate-line{
    font-size:13px;
    font-weight:700;
    margin-top:6px;
    color:#4b5563;
  }

  .fx-source a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid rgba(15,23,42,.25);
  }

  .fx-source a:hover{
    color:#111827;
  }

  .backup-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .backup-btn{
    border:1px solid var(--line);
    background:linear-gradient(180deg,#ffffff,#e9edf2);
    color:var(--text);
    font-weight:800;
    cursor:pointer;
  }

  .backup-btn:hover{
    transform:translateY(-1px);
    background:linear-gradient(180deg,#ffffff,#e3e8ef);
  }

  .backup-info{
    margin-top:10px;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(180deg,#ffffff,#f4f6f8);
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
  }

  .hidden-file{
    display:none;
  }

  @media (max-width:560px){
    .grid,.summary,.filters{grid-template-columns:1fr}
    .wrap{padding-top:14px}
    h1{font-size:26px}
  }
</style>


</head>
<body>
<div class="wrap">
  <h1>记账</h1>
  

  <div class="card">
    <div class="grid">
      <div class="field">
        <label>金额</label>
        <input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如 1200" />
      </div>

      <div class="field">
        <label>币种</label>
        <select id="currency">
          <option value="CNY">人民币 CNY</option>
          <option value="JPY">日元 JPY</option>
          <option value="KRW">韩元 KRW</option>
        </select>
      </div>

      <div class="field">
        <label>分类</label>
        <select id="category">
          <option value="日常">日常</option>
          <option value="娱乐">娱乐</option>
        </select>
      </div>

      <div class="field">
        <label>时间</label>
        <input id="date" type="datetime-local" />
      </div>

      <div class="field full">
        <label>备注（可选）</label>
        <input id="note" type="text" maxlength="50" placeholder="例如：便利店 / 演唱会 / 打车" />
      </div>

      <div class="full">
        <button class="btn" id="addBtn">＋ 记一笔</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>支出总览</h2>
      <input id="summaryMonth" type="month" style="width:auto;max-width:170px;padding:8px 10px;font-size:14px;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:12px;" />
    </div>
    <div class="summary">
      <div class="sum">
        <div class="name">人民币</div>
        <div class="money" id="sumCNY">本月共计 ¥0.00</div>
        <div class="meta" id="catCNY">日常 ¥0.00 · 娱乐 ¥0.00</div>
      </div>
      <div class="sum">
        <div class="name">日元</div>
        <div class="money" id="sumJPY">本月共计 ¥0</div>
        <div class="meta" id="catJPY">日常 ¥0 · 娱乐 ¥0</div>
      </div>
      <div class="sum">
        <div class="name">韩元</div>
        <div class="money" id="sumKRW">本月共计 ₩0</div>
        <div class="meta" id="catKRW">日常 ₩0 · 娱乐 ₩0</div>
      </div>
    </div>

  </div>

  <div class="card">
    <div class="section-title">
      <h2>汇率计算器</h2>
    </div>

    <div class="fx-status">
      <div class="fx-status-text" id="fxStatus">正在获取最新汇率…</div>
      <button class="fx-refresh" id="fxRefreshBtn">刷新汇率</button>
    </div>

    <div class="grid">
      <div class="field">
        <label>金额</label>
        <input id="fxAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如 1000" />
      </div>

      <div class="field">
        <label>当前汇率</label>
        <input id="fxRateDisplay" type="text" value="等待获取…" readonly />
      </div>

      <div class="field">
        <label>从</label>
        <select id="fxFrom">
          <option value="CNY">人民币 CNY</option>
          <option value="JPY">日元 JPY</option>
          <option value="KRW">韩元 KRW</option>
        </select>
      </div>

      <div class="field">
        <label>到</label>
        <select id="fxTo">
          <option value="CNY">人民币 CNY</option>
          <option value="JPY">日元 JPY</option>
          <option value="KRW">韩元 KRW</option>
        </select>
      </div>

      <div class="full">
        <button class="btn" id="fxSwapBtn">交换币种</button>
      </div>
    </div>

    <div class="result-box">
      <div class="meta" id="fxFormula">等待最新汇率</div>
      <div class="result-big" id="fxResult">—</div>
      <div class="fx-rate-line" id="fxRateLine"></div>
      <div class="small-note fx-source">
        汇率为市场参考中间价，实际银行卡 / 支付平台结算可能略有不同。
        <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>数据备份</h2>
    </div>

    <div class="backup-actions">
      <button class="backup-btn" id="exportBackupBtn">导出备份</button>
      <button class="backup-btn" id="importBackupBtn">导入恢复</button>
    </div>

    <input class="hidden-file" id="backupFileInput" type="file" accept=".json,application/json" />

    <div class="backup-info" id="backupStatus">
      建议在换手机、清理浏览器数据或重要记录较多时导出备份。备份文件只包含你的记账数据和汇率缓存。
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>记录</h2>
      <button class="clear" id="clearBtn">清空全部</button>
    </div>

    <div class="filters">
      <select id="filterCurrency">
        <option value="ALL">全部币种</option>
        <option value="CNY">人民币</option>
        <option value="JPY">日元</option>
        <option value="KRW">韩元</option>
      </select>
      <select id="filterCategory">
        <option value="ALL">全部分类</option>
        <option value="日常">日常</option>
        <option value="娱乐">娱乐</option>
      </select>
    </div>

    <div id="records"></div>
  </div>
</div>

<script>
  const KEY = 'travel-expense-book-v1';
  let records = JSON.parse(localStorage.getItem(KEY) || '[]');

  const amount = document.getElementById('amount');
  const currency = document.getElementById('currency');
  const category = document.getElementById('category');
  const date = document.getElementById('date');
  const note = document.getElementById('note');
  const recordsEl = document.getElementById('records');
  const filterCurrency = document.getElementById('filterCurrency');
  const filterCategory = document.getElementById('filterCategory');
  const summaryMonth = document.getElementById('summaryMonth');
  const fxAmount = document.getElementById('fxAmount');
  const fxRateDisplay = document.getElementById('fxRateDisplay');
  const fxFrom = document.getElementById('fxFrom');
  const fxTo = document.getElementById('fxTo');
  const fxFormula = document.getElementById('fxFormula');
  const fxResult = document.getElementById('fxResult');
  const fxRateLine = document.getElementById('fxRateLine');
  const fxStatus = document.getElementById('fxStatus');
  const fxRefreshBtn = document.getElementById('fxRefreshBtn');
  const exportBackupBtn = document.getElementById('exportBackupBtn');
  const importBackupBtn = document.getElementById('importBackupBtn');
  const backupFileInput = document.getElementById('backupFileInput');
  const backupStatus = document.getElementById('backupStatus');

  const FX_CACHE_KEY = 'travel-expense-fx-cache-v1';
  let fxRates = null;
  let fxUpdatedAt = null;

  function localDateTimeValue(d = new Date()){
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  date.value = localDateTimeValue();
  const nowForMonth = new Date();
  summaryMonth.value = `${nowForMonth.getFullYear()}-${String(nowForMonth.getMonth()+1).padStart(2,'0')}`;

  function money(v, c){
    const n = Number(v);
    if(c === 'CNY') return '¥' + n.toFixed(2);
    if(c === 'JPY') return '¥' + Math.round(n).toLocaleString('ja-JP');
    if(c === 'KRW') return '₩' + Math.round(n).toLocaleString('ko-KR');
    return String(n);
  }

  function currencyShortName(c){
    return c === 'CNY' ? '人民币' : c === 'JPY' ? '日元' : '韩元';
  }

  function formatRate(v){
    if(!Number.isFinite(v)) return '—';
    if(v >= 100) return v.toFixed(2);
    if(v >= 1) return v.toFixed(4);
    return v.toFixed(6);
  }

  function getFxRate(from, to){
    if(from === to) return 1;
    if(!fxRates) return null;

    const fromRate = from === 'CNY' ? 1 : Number(fxRates[from]);
    const toRate = to === 'CNY' ? 1 : Number(fxRates[to]);

    if(!fromRate || !toRate) return null;
    return toRate / fromRate;
  }

  function formatFxUpdateTime(value){
    if(!value) return '';
    const d = new Date(value);
    if(Number.isNaN(d.getTime())) return '';
    return d.toLocaleString('zh-CN', {
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', hour12:false
    });
  }

  function loadFxCache(){
    try{
      const cached = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
      if(cached && cached.rates){
        fxRates = cached.rates;
        fxUpdatedAt = cached.updatedAt || null;
        return true;
      }
    }catch(e){}
    return false;
  }

  async function fetchLatestRates(force = false){
    if(!navigator.onLine){
      if(loadFxCache()){
        fxStatus.textContent = `当前离线 · 使用缓存汇率 ${formatFxUpdateTime(fxUpdatedAt)}`;
        calculateFX();
      }else{
        fxStatus.textContent = '当前离线，暂时无法获取汇率';
      }
      return;
    }

    fxRefreshBtn.disabled = true;
    fxRefreshBtn.textContent = '刷新中…';
    fxStatus.textContent = '正在获取最新汇率…';

    try{
      const response = await fetch('https://open.er-api.com/v6/latest/CNY', {cache:'no-store'});
      if(!response.ok) throw new Error('HTTP ' + response.status);

      const data = await response.json();
      if(data.result !== 'success' || !data.rates) throw new Error('API error');

      fxRates = data.rates;
      fxUpdatedAt = data.time_last_update_utc || new Date().toISOString();

      localStorage.setItem(FX_CACHE_KEY, JSON.stringify({
        rates: fxRates,
        updatedAt: fxUpdatedAt
      }));

      fxStatus.textContent = `最新参考汇率 · 数据时间 ${formatFxUpdateTime(fxUpdatedAt)}`;
      calculateFX();
    }catch(err){
      if(loadFxCache()){
        fxStatus.textContent = `获取失败 · 已改用缓存汇率 ${formatFxUpdateTime(fxUpdatedAt)}`;
        calculateFX();
      }else{
        fxStatus.textContent = '汇率获取失败，请检查网络后重试';
        fxRateDisplay.value = '获取失败';
        fxFormula.textContent = '暂时无法计算';
        fxResult.textContent = '—';
      }
    }finally{
      fxRefreshBtn.disabled = false;
      fxRefreshBtn.textContent = '刷新汇率';
    }
  }

  function save(){
    localStorage.setItem(KEY, JSON.stringify(records));
  }

  function render(){
    const selectedMonth = summaryMonth.value || localDateTimeValue().slice(0,7);
    const [selectedYearText, selectedMonthText] = selectedMonth.split('-');
    const selectedYear = Number(selectedYearText);
    const selectedMonthIndex = Number(selectedMonthText) - 1;

    const monthly = {
      CNY:{total:0, 日常:0, 娱乐:0},
      JPY:{total:0, 日常:0, 娱乐:0},
      KRW:{total:0, 日常:0, 娱乐:0}
    };

    records.forEach(r => {
      const d = getRecordDate(r);
      if(d.getFullYear() === selectedYear && d.getMonth() === selectedMonthIndex){
        const value = Number(r.amount);
        monthly[r.currency].total += value;
        if(r.category === '日常' || r.category === '娱乐'){
          monthly[r.currency][r.category] += value;
        }
      }
    });

    const monthText = `${selectedMonthIndex + 1}月`;
    document.getElementById('sumCNY').textContent = `${monthText}共计 ${money(monthly.CNY.total,'CNY')}`;
    document.getElementById('sumJPY').textContent = `${monthText}共计 ${money(monthly.JPY.total,'JPY')}`;
    document.getElementById('sumKRW').textContent = `${monthText}共计 ${money(monthly.KRW.total,'KRW')}`;

    document.getElementById('catCNY').textContent =
      `日常 ${money(monthly.CNY['日常'],'CNY')} · 娱乐 ${money(monthly.CNY['娱乐'],'CNY')}`;
    document.getElementById('catJPY').textContent =
      `日常 ${money(monthly.JPY['日常'],'JPY')} · 娱乐 ${money(monthly.JPY['娱乐'],'JPY')}`;
    document.getElementById('catKRW').textContent =
      `日常 ${money(monthly.KRW['日常'],'KRW')} · 娱乐 ${money(monthly.KRW['娱乐'],'KRW')}`;

    const fc = filterCurrency.value;
    const fcat = filterCategory.value;

    const filtered = records
      .filter(r => fc === 'ALL' || r.currency === fc)
      .filter(r => fcat === 'ALL' || r.category === fcat)
      .sort((a,b) => getRecordDate(b) - getRecordDate(a));

    if(!filtered.length){
      recordsEl.innerHTML = '<div class="empty">还没有符合条件的记录</div>';
      return;
    }

    const groups = {};
    filtered.forEach(r => {
      const d = getRecordDate(r);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if(!groups[key]) groups[key] = [];
      groups[key].push(r);
    });

    recordsEl.innerHTML = Object.entries(groups).map(([day, items]) => `
      <div class="date-group">
        <div class="date-heading">${dateHeading(day)}</div>
        ${items.map(r => `
          <div class="record">
            <div class="left">
              <div class="title">${escapeHtml(r.note || r.category)}</div>
              <div class="meta">${formatRecordTime(r)} · ${r.category} · ${currencyName(r.currency)}${r.cnyReference != null && r.currency !== 'CNY' ? ` · ≈${money(r.cnyReference,'CNY')}` : ''}</div>
            </div>
            <div class="right">
              <div class="amount">-${money(r.amount, r.currency)}</div>
              <button class="delete" onclick="removeRecord('${r.id}')">删除</button>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  }

  function getRecordDate(r){
    if(r.date && r.date.includes('T')) return new Date(r.date);
    if(r.date) return new Date(r.date + 'T00:00:00');
    return new Date(r.createdAt || Date.now());
  }

  function formatRecordTime(r){
    const d = getRecordDate(r);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function dateHeading(day){
    const d = new Date(day + 'T00:00:00');
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    const sameDay = (a,b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();

    if(sameDay(d, today)) return '今天';
    if(sameDay(d, yesterday)) return '昨天';

    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
  }

  function currencyName(c){
    return c === 'CNY' ? '人民币' : c === 'JPY' ? '日元' : '韩元';
  }

  function calculateFX(){
    const amountValue = Number(fxAmount.value);
    const from = fxFrom.value;
    const to = fxTo.value;
    const rateValue = getFxRate(from, to);

    if(rateValue === null){
      fxRateDisplay.value = '等待汇率…';
      fxFormula.textContent = '等待最新汇率';
      fxResult.textContent = '—';
      fxRateLine.textContent = '';
      return;
    }

    fxRateDisplay.value = `1 ${from} = ${formatRate(rateValue)} ${to}`;
    fxRateLine.textContent =
      `1 ${currencyShortName(from)} = ${formatRate(rateValue)} ${currencyShortName(to)}`;

    if(!amountValue || amountValue <= 0){
      fxFormula.textContent = '输入金额后自动换算';
      fxResult.textContent = '—';
      return;
    }

    const result = amountValue * rateValue;
    fxFormula.textContent = `${money(amountValue, from)} × ${formatRate(rateValue)}`;
    fxResult.textContent = money(result, to);
  }

  function swapFX(){
    const from = fxFrom.value;
    fxFrom.value = fxTo.value;
    fxTo.value = from;
    calculateFX();
  }


  function exportBackup(){
    const payload = {
      app: '记账',
      version: 1,
      exportedAt: new Date().toISOString(),
      records: records,
      fxCache: (() => {
        try{
          return JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
        }catch(e){
          return null;
        }
      })()
    };

    const blob = new Blob(
      [JSON.stringify(payload, null, 2)],
      {type:'application/json;charset=utf-8'}
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    a.href = url;
    a.download = `记账备份-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    backupStatus.textContent = `已导出 ${records.length} 条记录。请把备份文件保存到“文件”或 iCloud Drive。`;
  }

  function openImportPicker(){
    backupFileInput.value = '';
    backupFileInput.click();
  }

  async function importBackupFile(file){
    if(!file) return;

    try{
      const text = await file.text();
      const data = JSON.parse(text);

      if(!data || !Array.isArray(data.records)){
        throw new Error('invalid');
      }

      const ok = confirm(
        `这个备份包含 ${data.records.length} 条记录。\n\n导入后会替换当前设备上的全部记账记录，是否继续？`
      );

      if(!ok){
        backupStatus.textContent = '已取消导入。';
        return;
      }

      records = data.records;
      localStorage.setItem(KEY, JSON.stringify(records));

      if(data.fxCache){
        localStorage.setItem(FX_CACHE_KEY, JSON.stringify(data.fxCache));
        fxRates = data.fxCache.rates || fxRates;
        fxUpdatedAt = data.fxCache.updatedAt || fxUpdatedAt;
      }

      render();
      calculateFX();

      backupStatus.textContent = `恢复成功：已导入 ${records.length} 条记录。`;
      alert(`恢复成功，共导入 ${records.length} 条记录。`);
    }catch(err){
      backupStatus.textContent = '导入失败：这个文件不是有效的“记账”备份文件。';
      alert('导入失败，请选择之前由“记账”导出的 JSON 备份文件。');
    }
  }

  function addRecord(){
    const a = Number(amount.value);
    if(!a || a <= 0){
      alert('请输入正确的金额');
      amount.focus();
      return;
    }
    const selectedCurrency = currency.value;
    const toCnyRate = getFxRate(selectedCurrency, 'CNY');
    const cnyReference = toCnyRate ? a * toCnyRate : null;

    records.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      amount: a,
      currency: selectedCurrency,
      category: category.value,
      date: date.value || localDateTimeValue(),
      note: note.value.trim(),
      createdAt: new Date().toISOString(),
      cnyReference: cnyReference,
      fxRateAtEntry: toCnyRate,
      fxUpdatedAt: fxUpdatedAt
    });
    save();
    amount.value = '';
    note.value = '';
    date.value = localDateTimeValue();
    amount.focus();
    fxFrom.value = 'CNY';
  fxTo.value = 'JPY';
  loadFxCache();
  calculateFX();
  fetchLatestRates();
  render();
  }

  window.removeRecord = function(id){
    records = records.filter(r => r.id !== id);
    save();
    render();
  }

  document.getElementById('addBtn').addEventListener('click', addRecord);
  amount.addEventListener('keydown', e => {
    if(e.key === 'Enter') addRecord();
  });

  fxAmount.addEventListener('input', calculateFX);
  fxFrom.addEventListener('change', calculateFX);
  fxTo.addEventListener('change', calculateFX);
  document.getElementById('fxSwapBtn').addEventListener('click', swapFX);
  fxRefreshBtn.addEventListener('click', () => fetchLatestRates(true));

  exportBackupBtn.addEventListener('click', exportBackup);
  importBackupBtn.addEventListener('click', openImportPicker);
  backupFileInput.addEventListener('change', e => {
    importBackupFile(e.target.files && e.target.files[0]);
  });

  filterCurrency.addEventListener('change', render);
  filterCategory.addEventListener('change', render);
  summaryMonth.addEventListener('change', render);

  document.getElementById('clearBtn').addEventListener('click', () => {
    if(records.length && confirm('确定清空全部记账记录吗？')){
      records = [];
      save();
      render();
    }
  });

  render();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
</script>
